<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Content-Security-Policy (ships with the page so it applies on any
      static host). Scripts only from this origin, no inline JS; wasm
      compilation is the one scoped exception. Inline style *attributes*
      are used by the Yew views, hence style-src unsafe-inline.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' blob: data:; connect-src 'self' blob: data:; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9eaf0" media="(prefers-color-scheme: light)" />
    <title>wipfel — web based gipfel photogrammetry</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script type="module" src="loader.js"></script>
  </body>
</html>
