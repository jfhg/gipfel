<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#141418" />

    <link rel="manifest" href="manifest.webmanifest" />

          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>
