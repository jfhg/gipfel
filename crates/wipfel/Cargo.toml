[package]
name = "wipfel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wipfel — web based gipfel photogrammetry for mountain images"

[dependencies]
gipfel-core = { path = "../gipfel-core" }
flate2 = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
yew = { version = "0.21", features = ["csr"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Blob",
    "CanvasRenderingContext2d",
    "DataTransfer",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "ImageBitmap",
    "InputEvent",
    "MouseEvent",
    "PointerEvent",
    "Request",
    "Response",
    "ResizeObserver",
    "TextMetrics",
    "Window",
    "WheelEvent",
]
